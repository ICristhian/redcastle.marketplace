name: Security checks

on:
  push:
    branches: [main, "security/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-security:
    name: Static security checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: node --check public/js/store.js
      - name: Check JavaScript module syntax
        run: |
          for file in public/js/config.js public/js/backend.js public/js/portal.js public/js/admin.js; do
            node --input-type=module --check < "$file"
          done
      - name: Check site security policies
        run: node scripts/security-check.cjs
      - name: Check portal security assertions
        run: node scripts/portal-security-check.cjs
