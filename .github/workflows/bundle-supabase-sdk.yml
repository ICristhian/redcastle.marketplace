name: Bundle local Supabase SDK

on:
  push:
    branches: [feature/reservation-portal]
    paths:
      - package.json
      - scripts/bundle-sdk.mjs
      - scripts/supabase-sdk-entry.mjs
      - .github/workflows/bundle-supabase-sdk.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bundle-sdk-feature-reservation-portal
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feature/reservation-portal
          persist-credentials: true
      - name: Install pinned dependencies and generate lockfile
        run: npm install --no-audit --no-fund
      - name: Generate local ESM module
        run: npm run build:sdk
      - name: Check bundle is present and self contained
        run: |
          test -s public/js/vendor/supabase.mjs
          node --check public/js/vendor/supabase.mjs
          if grep -E 'from ["\x27]https?://' public/js/vendor/supabase.mjs; then
            echo 'Remote imports are not allowed'
            exit 1
          fi
      - name: Commit generated asset and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json public/js/vendor/
          if ! git diff --cached --quiet; then
            git commit -m "build: vendor pinned Supabase SDK for Cloudflare [skip ci]"
            git push origin HEAD:feature/reservation-portal
          fi
